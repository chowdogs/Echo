# Codemagic CI build for Echo.
#
# Builds an UNSIGNED iOS .ipa you can install on your iPhone with Sideloadly.
# The ElevenLabs API key is NOT in this file — it is read from an encrypted
# environment variable you add in the Codemagic dashboard, so the secret never
# lives in the repository.
#
# ── Where to put the API key (one-time setup) ─────────────────────────────
#   1. codemagic.io → open this app → "Environment variables"
#   2. Add:  name: ELEVENLABS_API_KEY   value: sk_...   group: echo_secrets
#      and tick "Secure".
#   3. Run the "ios-sideload" workflow → download Echo.ipa → sideload it.
# ──────────────────────────────────────────────────────────────────────────

workflows:
  ios-sideload:
    name: Echo iOS (unsigned, for Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - echo_secrets        # must contain ELEVENLABS_API_KEY (added in the UI)
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate iOS config, no signing (injects the ElevenLabs key)
        script: flutter build ios --release --config-only --no-codesign --no-tree-shake-icons --dart-define=ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build unsigned app (code signing disabled)
        script: xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build/ios_output CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ENABLE_BITCODE=NO build
      - name: Package unsigned .ipa for Sideloadly
        script: |
          APP=$(find build/ios_output/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Packaging $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r Echo.ipa Payload
    artifacts:
      - Echo.ipa
